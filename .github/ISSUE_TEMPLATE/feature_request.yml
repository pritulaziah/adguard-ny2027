name: Feature request
description: Propose a change to the page or its content
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing, or wrong today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the page do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Which other options did you consider?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: A sketch, a reference, or a screenshot.
    validations:
      required: false
